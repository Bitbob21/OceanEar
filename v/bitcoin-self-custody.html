<!DOCTYPE html>

      color:#cbd5e1;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 16px;
      background-image:

    .meta a{color:#64748b;text-decoration:underline;text-decoration-color:#1e3a4a;text-underline-offset:3px;transition:color .2s}
    .meta a:hover{color:#94a3b8}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      font-size:11px;font-weight:600;
      color:#f7931a;
      padding:3px 9px;border-radius:999px;
      background:rgba(247,147,26,.08);

    .download{margin-top:8px;font-size:12px}
